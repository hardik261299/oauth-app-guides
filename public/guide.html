<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OAuth guide</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="root"><p>Loading...</p></main>
<script type="module">
  import { el, link, badge, decodeGuide } from '/common.js';

  const root = document.getElementById('root');

  async function load() {
    const slug = new URLSearchParams(location.search).get('slug');
    if (slug) {
      const res = await fetch(`/api/guide?slug=${encodeURIComponent(slug)}`);
      if (!res.ok) throw new Error('Guide not found');
      return res.json();
    }
    if (location.hash.startsWith('#g=')) return decodeGuide(location.hash.slice(3));
    throw new Error('No guide specified');
  }

  const confTag = c => el('span', { class: `tag ${c === 'confirmed' ? 'confirmed' : 'unconfirmed'}`, text: c === 'confirmed' ? 'confirmed in source' : 'unconfirmed' });
  const fact = (label, ...kids) => el('div', { class: 'fact' }, el('b', { text: label }), ...kids);
  const list = items => el('ul', { class: 'plain' }, items.map(t => el('li', { text: t })));

  function render(g) {
    document.title = `${g.name} OAuth guide`;
    const isStub = g.meta?.generatedBy === 'stub';
    const parts = [
      el('p', {}, el('a', { href: '/', text: '< All guides' })),
      el('h1', { text: g.name }),
      el('p', {}, badge(g.difficulty), ' ', el('span', { class: 'hint', text: g.difficultyWhy || '' })),
      el('p', { text: g.summary }),
    ];
    if (isStub) parts.push(el('div', { class: 'banner', text: 'This guide was NOT researched (no LLM key configured). Do not rely on it.' }));
    if (g.meta?.generatedBy === 'agent') parts.push(el('div', { class: 'banner', text: 'Generated by a research agent from public sources just now. It has not been human-reviewed. Check the sources and "unconfirmed" tags before acting.' }));

    parts.push(el('div', { class: 'facts' },
      fact('Hands-on time', el('span', { text: g.time.handsOn })),
      fact('Approval wait', el('span', { text: g.time.wait }), confTag(g.time.waitConfidence)),
      fact('Approval needed', el('span', { text: g.approval.required }), el('div', { class: 'hint', text: g.approval.details }))));

    parts.push(el('h2', { text: 'Requirements and nuances' }),
      el('ul', { class: 'plain' }, g.requirements.map(r => el('li', {}, r.text, confTag(r.confidence), r.source ? [' ', link('source', r.source)] : null))));

    parts.push(el('h2', { text: 'Steps' }),
      el('ol', { class: 'steps' }, g.steps.map(s => el('li', {},
        el('b', { text: s.title }), el('span', { class: `owner ${s.owner}`, text: s.owner === 'agent' ? 'agent can do' : s.owner === 'both' ? 'agent + you' : 'you' }),
        el('div', { text: s.detail }), s.source ? el('div', {}, link('source', s.source)) : null))));

    if (g.blockers.length) parts.push(el('h2', { text: 'If you get blocked' }),
      el('ul', { class: 'plain' }, g.blockers.map(b => el('li', {}, el('b', { text: b.issue + ': ' }), b.fix))));

    parts.push(el('h2', { text: 'Agent vs. you' }), el('div', { class: 'two' },
      el('div', { class: 'box' }, el('h2', { text: 'An agent can' }), list(g.agentCan)),
      el('div', { class: 'box' }, el('h2', { text: 'You need to' }), list(g.developerMust))));

    if (g.uncertain.length) parts.push(el('h2', { text: 'What we could not verify' }), list(g.uncertain));
    if (g.sources.length) parts.push(el('h2', { text: 'Sources' }),
      el('ul', { class: 'plain' }, g.sources.map(s => el('li', {}, link(s.title || s.url, s.url)))));

    parts.push(el('p', { class: 'meta', text: `${g.meta?.generatedBy || ''} | researched ${g.meta?.researchedOn || ''} | ${g.meta?.tested || ''}` }),
      el('button', { class: 'secondary', text: 'Copy share link', onclick: e => { navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied'; } }));

    root.replaceChildren(...parts);
  }

  load().then(render).catch(err => root.replaceChildren(el('p', { text: err.message }), el('a', { href: '/', text: 'Back' })));
</script>
</body>
</html>
